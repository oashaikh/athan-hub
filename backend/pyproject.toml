[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "athan-hub"
version = "2.0.0"
description = "Headless prayer timetable and Bluetooth Athan player for Ubuntu and Debian"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.7.0,<3",
  "pydantic-settings>=2.2.1,<3",
  "SQLAlchemy>=2.0.30,<3",
  "filelock>=3.13.1,<4",
  "python-dateutil>=2.9.0.post0,<3",
  "mutagen>=1.47,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.0,<1",
  "pytest>=8.2.0,<9",
  "pytest-cov>=5.0.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
