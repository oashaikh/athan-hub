# go2rtc (CAM720 fork) config for local two-way talk to the Jooan camera.
# Runs beside Home Assistant's own go2rtc on separate ports. Values are filled
# from /etc/athan-hub/athan-hub.env at service start; no secrets live here.
api:
  listen: "127.0.0.1:1985"
rtsp:
  listen: ":8556"
webrtc:
  listen: ":8557"
log:
  level: warn
streams:
  cam720: cam720://${ATHAN_HA_CAMERA_IP}/${ATHAN_HA_CAMERA_UID}?token=${ATHAN_HA_CAMERA_P2P_TOKEN}
