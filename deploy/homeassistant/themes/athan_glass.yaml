# Gradient glass theme for the Home dashboard. Select it under Profile > Theme,
# or per dashboard view (the Home dashboard sets it on its view).
Athan Glass:
  lovelace-background: "center / cover no-repeat fixed linear-gradient(140deg, #6a2ce8 0%, #b81ba0 32%, #ff2a6d 62%, #ff8d5c 88%, #ffb38a 100%)"
  primary-color: "#ffffff"
  accent-color: "#ffd166"
  primary-text-color: "#ffffff"
  secondary-text-color: "rgba(255, 255, 255, 0.72)"
  disabled-text-color: "rgba(255, 255, 255, 0.45)"
  primary-background-color: "#3b1660"
  secondary-background-color: "rgba(255, 255, 255, 0.10)"
  card-background-color: "rgba(255, 255, 255, 0.14)"
  ha-card-background: "rgba(255, 255, 255, 0.14)"
  ha-card-border-radius: "14px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "none"
  ha-tile-icon-border-radius: "50%"
  divider-color: "rgba(255, 255, 255, 0.18)"
  state-icon-color: "rgba(255, 255, 255, 0.85)"
  state-active-color: "#ffd166"
  app-header-background-color: "transparent"
  app-header-text-color: "#ffffff"
  app-header-edit-background-color: "#3b1660"
  sidebar-background-color: "#2c1048"
  sidebar-text-color: "#ffffff"
  sidebar-icon-color: "rgba(255, 255, 255, 0.75)"
  sidebar-selected-text-color: "#ffd166"
  sidebar-selected-icon-color: "#ffd166"
  paper-listbox-background-color: "#3b1660"
  mdc-theme-surface: "#3b1660"
  input-fill-color: "rgba(255, 255, 255, 0.10)"
  codemirror-property: "#ffd166"
